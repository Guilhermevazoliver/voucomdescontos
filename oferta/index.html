<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="page-title">Oferta | Vou com Descontos</title>
<meta name="robots" content="noindex" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0d3b2e" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg: #f7f8f5; --surface: #ffffff; --ink: #0f1a14; --ink-muted: #5b6b62;
    --line: #e3e7de; --green-deep: #0d3b2e; --green-vivid: #16a34a; --gold: #c9a13b;
    --radius-lg: 22px; --radius-md: 14px;
    --shadow: 0 1px 2px rgba(15,26,20,.04), 0 8px 24px -12px rgba(15,26,20,.18);
    --maxw: 880px;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5; }
  h1, h2, .display { font-family: "Manrope", "Inter", sans-serif; letter-spacing: -0.02em; margin: 0; }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }
  header.top { background: var(--green-deep); padding: 16px 0; }
  header.top a { color: #fff; font-weight: 800; font-family: Manrope, sans-serif; text-decoration: none; }

  main { padding: 28px 0 60px; }
  .product { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 24px; display: grid; gap: 22px; }
  @media (min-width: 640px) { .product { grid-template-columns: 260px 1fr; } }
  .thumb { background: #eef1ec; border-radius: var(--radius-md); aspect-ratio: 1; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; padding: 16px; }

  .brand { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-muted); font-weight: 700; }
  .title { font-size: 1.35rem; margin-top: 4px; }
  .smart-price {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
    font-size: .82rem; font-weight: 700; padding: 5px 12px; border-radius: 999px;
  }
  .smart-price.excelente { background: #dcfce7; color: #166534; }
  .smart-price.bom { background: #dcfce7; color: #166534; }
  .smart-price.normal { background: #fef9c3; color: #854d0e; }
  .smart-price.caro { background: #fee2e2; color: #991b1b; }
  .smart-price.sem_historico_suficiente { background: #f1f5f4; color: var(--ink-muted); }

  .price-row { display: flex; align-items: baseline; gap: 10px; margin-top: 16px; }
  .price { font-family: Manrope, sans-serif; font-weight: 800; font-size: 2rem; }
  .original { font-size: 1rem; color: var(--ink-muted); text-decoration: line-through; }
  .discount { color: var(--green-vivid); font-weight: 800; font-size: .95rem; }

  .cta {
    display: inline-flex; margin-top: 18px; background: var(--green-vivid); color: #04150c;
    font-weight: 800; font-family: Manrope, sans-serif; padding: 14px 26px; border-radius: 999px;
    text-decoration: none; font-size: 1rem;
  }
  .transparency { margin-top: 14px; font-size: .78rem; color: var(--ink-muted); line-height: 1.5; }

  .watch-form { margin-top: 20px; padding: 14px; background: var(--bg); border-radius: var(--radius-md); border: 1px solid var(--line); }
  .watch-form label { font-size: .85rem; font-weight: 700; display: block; margin-bottom: 8px; }
  .watch-form .row { display: flex; gap: 8px; }
  .watch-form input {
    flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); font-family: inherit; font-size: .9rem;
  }
  .watch-form button {
    background: var(--green-deep); color: #fff; border: none; padding: 0 18px; border-radius: 10px;
    font-weight: 700; cursor: pointer; font-family: Manrope, sans-serif;
  }
  .watch-status { margin-top: 8px; font-size: .82rem; }

  .price-chart { margin-top: 16px; }
  .price-chart .chart-labels { display: flex; justify-content: space-between; font-size: .72rem; color: var(--ink-muted); margin-top: 4px; }
  .price-chart svg { width: 100%; height: 70px; display: block; }

  .other-offers { margin-top: 30px; }
  .other-offers h2 { font-size: 1.05rem; margin-bottom: 12px; }
  .offer-row {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 8px;
  }
  .offer-row .store { font-size: .8rem; color: var(--ink-muted); font-weight: 700; text-transform: uppercase; }
  .offer-row .price { font-size: 1rem; }
  .offer-row a { color: var(--green-deep); font-weight: 700; font-size: .85rem; text-decoration: underline; }

  .skeleton, .empty { text-align: center; padding: 60px 0; color: var(--ink-muted); }
</style>
</head>
<body>

<header class="top"><div class="wrap"><a href="/">Vou com Descontos</a></div></header>

<main class="wrap">
  <div id="content"><div class="skeleton">Carregando oferta...</div></div>
</main>

<script>
  const API_BASE = "https://xnavhkburafdjtuxaslo.supabase.co/functions/v1";
  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  function moneyBRL(n) { return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function getAnonymousId() {
    let id = localStorage.getItem("vcd_anon_id");
    if (!id) {
      id = "anon_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem("vcd_anon_id", id);
    }
    return id;
  }

  const SMART_PRICE_LABELS = {
    excelente: "🟢 Preço excelente", bom: "🟢 Preço bom", normal: "🟡 Preço normal", caro: "🔴 Caro",
    sem_historico_suficiente: null,
  };

  function shortDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
  }

  // Desenha só os pontos REALMENTE observados (checked_at real), sem
  // interpolar nada entre eles — se só tem 1 checagem ainda, não desenha
  // gráfico nenhum (não tem o que comparar de verdade).
  function priceChartHtml(history) {
    if (!history || history.length < 2) return "";
    const prices = history.map((h) => h.price);
    const times = history.map((h) => new Date(h.checkedAt).getTime());
    const minP = Math.min(...prices), maxP = Math.max(...prices);
    const minT = Math.min(...times), maxT = Math.max(...times);
    const w = 300, h = 60, pad = 6;
    const xOf = (t) => (maxT === minT ? w / 2 : pad + ((t - minT) / (maxT - minT)) * (w - pad * 2));
    const yOf = (p) => (maxP === minP ? h / 2 : h - pad - ((p - minP) / (maxP - minP)) * (h - pad * 2));
    const points = history.map((pt) => `${xOf(new Date(pt.checkedAt).getTime()).toFixed(1)},${yOf(pt.price).toFixed(1)}`).join(" ");
    const lastX = xOf(times[times.length - 1]);
    const lastY = yOf(prices[prices.length - 1]);
    return `
      <div class="price-chart">
        <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <polyline points="${points}" fill="none" stroke="#16a34a" stroke-width="2" vector-effect="non-scaling-stroke" />
          <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3" fill="#0d3b2e" />
        </svg>
        <div class="chart-labels">
          <span>${shortDate(history[0].checkedAt)} · ${moneyBRL(minP)}${minP !== maxP ? ` a ${moneyBRL(maxP)}` : ""}</span>
          <span>${history.length} checagem${history.length === 1 ? "" : "s"} real${history.length === 1 ? "" : "is"}</span>
        </div>
      </div>`;
  }

  function render(p) {
    document.title = `${p.title} | Vou com Descontos`;
    const content = document.getElementById("content");

    if (!p.bestOffer) {
      content.innerHTML = `<div class="empty">Essa oferta não está mais ativa.<br><br><a href="/buscar/">Ver outras ofertas</a></div>`;
      return;
    }

    const discountPercent = p.bestOffer.originalPrice
      ? Math.round(((p.bestOffer.originalPrice - p.bestOffer.price) / p.bestOffer.originalPrice) * 100)
      : null;

    const smartLabel = SMART_PRICE_LABELS[p.smartPrice?.label];
    const smartHtml = smartLabel
      ? `<div class="smart-price ${p.smartPrice.label}">${smartLabel}</div>`
      : `<div class="smart-price sem_historico_suficiente">Monitorado há ${p.smartPrice?.monitoredSinceDays ?? 0} dia(s)</div>`;

    content.innerHTML = `
      <div class="product">
        <div class="thumb">${p.imageUrl ? `<img src="${p.imageUrl}" alt="${escapeHtml(p.title)}"/>` : ""}</div>
        <div>
          ${p.brand ? `<div class="brand">${escapeHtml(p.brand)}</div>` : ""}
          <h1 class="title">${escapeHtml(p.title)}</h1>
          ${smartHtml}
          ${priceChartHtml(p.priceHistory)}
          <div class="price-row">
            <span class="price">${moneyBRL(p.bestOffer.price)}</span>
            ${p.bestOffer.originalPrice ? `<span class="original">${moneyBRL(p.bestOffer.originalPrice)}</span>` : ""}
            ${discountPercent ? `<span class="discount">${discountPercent}% OFF</span>` : ""}
          </div>
          <a class="cta" href="${p.bestOffer.trackedLinkUrl}" target="_blank" rel="noopener">Ver oferta na loja</a>
          <div class="transparency">
            Você será direcionado para a loja responsável pela venda (${escapeHtml(p.bestOffer.store).replace("_br","").replace("_influenciador","")}).
            Alguns links podem gerar comissão para o Vou com Descontos, sem custo adicional para você.
          </div>

          <div class="watch-form">
            <label>🔔 Me avise quando ficar mais barato</label>
            <div class="row">
              <input id="target-price" type="number" step="0.01" placeholder="Qual preço você quer pagar?" />
              <button id="watch-btn">Avisar</button>
            </div>
            <div class="watch-status" id="watch-status"></div>
          </div>
        </div>
      </div>

      ${p.otherOffers && p.otherOffers.length > 0 ? `
        <div class="other-offers">
          <h2>Outras lojas</h2>
          ${p.otherOffers.map((o) => `
            <div class="offer-row">
              <span class="store">${escapeHtml(o.store).replace("_br","").replace("_influenciador","")}</span>
              <span class="price">${moneyBRL(o.price)}</span>
              <a href="${o.trackedLinkUrl}" target="_blank" rel="noopener">Ver oferta</a>
            </div>`).join("")}
        </div>` : ""}
    `;

    document.getElementById("watch-btn").addEventListener("click", async () => {
      const target = Number(document.getElementById("target-price").value);
      const statusEl = document.getElementById("watch-status");
      if (!target || target <= 0) { statusEl.textContent = "Digite um preço válido."; return; }
      statusEl.textContent = "Salvando...";
      try {
        const res = await fetch(`${API_BASE}/watchlist`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ anonymousId: getAnonymousId(), canonicalProductId: id, targetPrice: target, queryOriginal: p.title }),
        });
        const data = await res.json();
        statusEl.textContent = data.alreadyReached
          ? "✅ Esse preço já está disponível agora! Confira acima."
          : `✅ Combinado — vamos te mostrar em "Minha Lista" quando chegar em ${moneyBRL(target)}.`;
      } catch {
        statusEl.textContent = "Não consegui salvar agora, tenta de novo.";
      }
    });
  }

  if (!id) {
    document.getElementById("content").innerHTML = `<div class="empty">Oferta não encontrada.</div>`;
  } else {
    fetch(`${API_BASE}/product-detail?id=${id}`)
      .then((r) => r.json())
      .then(render)
      .catch(() => {
        document.getElementById("content").innerHTML = `<div class="empty">Não consegui carregar essa oferta agora.</div>`;
      });
  }
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
</body>
</html>
