<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>voucomdescontos — ofertas reais, direto no WhatsApp</title>
  <meta name="description" content="Achados e promoções reais em produtos, direto no seu WhatsApp. Entre no grupo e não perca nenhuma oferta." />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --bg-2: #111827;
      --accent: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, var(--bg), var(--bg-2));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      text-align: center;
    }
    .logo {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .logo span { color: var(--accent); }
    p.tagline {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .cta {
      display: inline-block;
      background: var(--accent);
      color: #052e16;
      font-weight: 700;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 1.05rem;
      transition: transform 0.15s ease;
    }
    .cta:hover { transform: scale(1.03); }
    .categorias {
      margin-top: 32px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .categorias span {
      font-size: 0.85rem;
      color: var(--text-muted);
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 6px 14px;
    }
    footer {
      margin-top: 48px;
      font-size: 0.8rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">vou<span>com</span>descontos</div>
    <p class="tagline">
      Achados e promoções reais em produtos — sem enrolação, direto pro seu WhatsApp.
    </p>
    <a class="cta" href="https://chat.whatsapp.com/HK8jiv2FZl89kftx0LMbyl" target="_blank" rel="noopener">
      Entrar no grupo do WhatsApp
    </a>
    <div class="categorias">
      <span>eletrônicos</span>
      <span>casa</span>
      <span>acessórios</span>
      <span>escritório</span>
    </div>
    <footer>voucomdescontos.com.br</footer>
  </main>
</body>
</html>
