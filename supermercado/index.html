<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Supermercado | Vou com Descontos</title>
<meta name="description" content="Economize no que você já compra toda semana ou todo mês — higiene, limpeza, mercearia, bebê, pet e descartáveis, com preço por unidade sempre visível." />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0d3b2e" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="canonical" href="https://voucomdescontos.com.br/supermercado/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg: #f7f8f5; --surface: #ffffff; --ink: #0f1a14; --ink-muted: #5b6b62;
    --line: #e3e7de; --green-deep: #0d3b2e; --green-vivid: #16a34a; --gold: #c9a13b;
    --radius-lg: 22px; --radius-md: 14px;
    --shadow: 0 1px 2px rgba(15,26,20,.04), 0 8px 24px -12px rgba(15,26,20,.18);
    --maxw: 1120px;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5; }
  h1, h2, .display { font-family: "Manrope", "Inter", sans-serif; letter-spacing: -0.02em; margin: 0; }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }

  header.top { background: var(--green-deep); padding: 16px 0; }
  header.top .wrap { display: flex; align-items: center; gap: 16px; justify-content: space-between; }
  .logo { color: #fff; font-weight: 800; font-size: 1.05rem; font-family: Manrope, sans-serif; }
  header.top nav a { color: #cfe3d5; font-size: .85rem; font-weight: 600; margin-left: 16px; }

  .hero { background: linear-gradient(160deg, #7a4a12, #c9a13b); color: #2b1d02; padding: 36px 0; }
  .hero h1 { font-size: 1.8rem; }
  .hero p { color: #3d2c05; margin-top: 8px; max-width: 60ch; font-size: .95rem; }
  .hero .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .hero .chip { background: rgba(255,255,255,.55); font-size: .78rem; font-weight: 700; padding: 5px 12px; border-radius: 999px; }

  main { padding: 28px 0 60px; }
  .results-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
  .results-head h2 { font-size: 1.15rem; }
  .results-head .count { color: var(--ink-muted); font-size: .88rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card {
    background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow);
    overflow: hidden; display: flex; flex-direction: column; transition: transform .15s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .card .thumb { aspect-ratio: 1; background: #eef1ec; position: relative; }
  .card .thumb img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
  .card .discount-badge {
    position: absolute; top: 8px; left: 8px; background: var(--gold); color: #2b1d02;
    font-size: .72rem; font-weight: 800; padding: 3px 8px; border-radius: 999px;
  }
  .card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .store { font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-muted); font-weight: 700; }
  .card .title { font-size: .88rem; line-height: 1.35; flex: 1; }
  .card .price-row { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
  .card .price { font-family: Manrope, sans-serif; font-weight: 800; font-size: 1.15rem; }
  .card .original { font-size: .78rem; color: var(--ink-muted); text-decoration: line-through; }
  .card .unit-price { font-size: .74rem; color: var(--ink-muted); }
  .card .cta {
    margin-top: 8px; display: block; text-align: center; background: var(--green-deep); color: #fff;
    font-weight: 700; font-size: .82rem; padding: 9px; border-radius: 999px; font-family: Manrope, sans-serif;
  }

  .empty { text-align: center; padding: 60px 0; color: var(--ink-muted); }
  .empty a { color: var(--green-deep); font-weight: 700; text-decoration: underline; }
  .skeleton { color: var(--ink-muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="/">Vou com Descontos</a>
    <nav><a href="/buscar/">Buscar</a><a href="/categorias/">Categorias</a><a href="/julia/">Jul-IA</a></nav>
  </div>
</header>

<div class="hero">
  <div class="wrap">
    <h1>🛒 Supermercado</h1>
    <p>Economize no que você já compra toda semana ou todo mês — sempre com o preço por unidade visível, pra comparar de verdade.</p>
    <div class="chips">
      <span class="chip">🧴 Higiene</span>
      <span class="chip">🧽 Limpeza</span>
      <span class="chip">🛒 Mercearia</span>
      <span class="chip">👶 Bebê</span>
      <span class="chip">🐾 Pet</span>
      <span class="chip">🧻 Descartáveis</span>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="results-head">
    <h2>Ofertas ativas agora</h2>
    <span class="count" id="results-count"></span>
  </div>
  <div id="results"><div class="skeleton">Buscando ofertas reais...</div></div>
</main>

<script>
  const API_BASE = "https://xnavhkburafdjtuxaslo.supabase.co/functions/v1";

  function moneyBRL(n) {
    return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function cardHtml(r) {
    const img = r.imageUrl ? `<img src="${r.imageUrl}" alt="${escapeHtml(r.title)}" loading="lazy" />` : "";
    const badge = r.discountPercent ? `<span class="discount-badge">${r.discountPercent}% OFF</span>` : "";
    const original = r.originalPrice ? `<span class="original">${moneyBRL(r.originalPrice)}</span>` : "";
    return `
      <a class="card" href="/oferta/?id=${r.canonicalProductId}">
        <div class="thumb">${img}${badge}</div>
        <div class="body">
          <span class="store">${escapeHtml(r.store).replace("_br", "").replace("_influenciador", "")}</span>
          <span class="title">${escapeHtml(r.title)}</span>
          <div class="price-row"><span class="price">${moneyBRL(r.price)}</span>${original}</div>
          <span class="cta">Ver oferta</span>
        </div>
      </a>`;
  }

  async function load() {
    const el = document.getElementById("results");
    try {
      const url = new URL(API_BASE + "/search-products");
      url.searchParams.set("vertical", "supermercado");
      url.searchParams.set("sort", "recent");
      url.searchParams.set("limit", "60");
      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok || !Array.isArray(data.results)) throw new Error(data.error || "resposta inválida");

      document.getElementById("results-count").textContent =
        data.count + (data.count === 1 ? " oferta encontrada" : " ofertas encontradas");

      if (data.results.length === 0) {
        el.innerHTML = `<div class="empty">Nenhuma oferta ativa neste grupo ainda — a Jul-IA já está procurando.<br><br>
          <a href="/">Ver os outros grupos de WhatsApp</a></div>`;
        return;
      }
      el.innerHTML = `<div class="grid">${data.results.map(cardHtml).join("")}</div>`;
    } catch (e) {
      el.innerHTML = '<div class="empty">Não consegui buscar agora. Tenta de novo em instantes.</div>';
    }
  }

  load();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
</body>
</html>
